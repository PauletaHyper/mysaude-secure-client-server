# ============================================================
#  Snort Configuration — MySaude IDS
#  Trabalho 3, Parte II — Segurança Informática 2025/26
# ============================================================
#
#  Invocação:
#    sudo snort -i <interface> -A console -q -c ids/mysaude_snort.conf
#
#  Exemplos de interface:
#    eth0   — máquinas de laboratório mais antigas
#    ens3   — máquinas virtuais / laboratório DI
#    (obter com: ip link show)
# ============================================================

# ============================================================
#  CONFIGURAÇÃO — AJUSTAR ANTES DE USAR
# ============================================================
#
#  Sub-rede do servidor com máscara /23 (255.255.254.0)
#  Ex: servidor em 10.101.85.X -> HOME_NET = 10.101.84.0/23
#      servidor em 10.121.53.X -> HOME_NET = 10.121.52.0/23
var HOME_NET 10.101.84.0/23

var RULE_PATH .

# ============================================================
#  PREPROCESSADORES
#  stream5 é necessário para tracking correto de sessões TCP
#  e contagem de ligações por source/destination.
# ============================================================
preprocessor stream5_global: track_tcp yes, track_udp no, track_icmp no
preprocessor stream5_tcp: policy first

# ============================================================
#  EVENT FILTERS (antes do include — threshold inline e standalone são deprecated)
# ============================================================

# S1 — alerta a cada 6 SYN para portos < 2048 em 2 minutos (qualquer origem)
event_filter gen_id 1, sig_id 1000001, type threshold, track by_dst, count 6, seconds 120

# S2 — 1 alerta único após 7 ligações do mesmo IP para 8080 em 30 segundos
event_filter gen_id 1, sig_id 1000002, type both, track by_src, count 7, seconds 30

# S3 — no máximo 5 alertas ICMP echo-request em 45 segundos
event_filter gen_id 1, sig_id 1000003, type limit, track by_dst, count 5, seconds 45

# ============================================================
#  REGRAS MySaude
# ============================================================
include $RULE_PATH/mysaude.rules
